[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "martech-estate-impact"
version = "1.0.0"
description = "Evidence-backed architecture change analysis for a synthetic Marketing estate"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.2.9"]

[project.scripts]
estate-impact = "estate_impact.cli:main"
estate-change-console = "estate_change.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
estate_change = ["schema.sql", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

