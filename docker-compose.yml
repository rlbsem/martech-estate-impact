services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: estate
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate -d estate"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - estate_pg:/var/lib/postgresql/data
volumes:
  estate_pg:
